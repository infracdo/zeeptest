<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ "Launching Zeep Web App" if pwa else "Downloading ZEEP" }}</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    img.logo {
      width: 120px;
      margin-bottom: 24px;
    }

    .message {
      font-size: 1.25rem;
      font-weight: 600;
      max-width: 400px;
    }

    .subtle {
      margin-top: 12px;
      font-size: 0.95rem;
      color: #666;
    }
  </style>
  <script>
    window.onload = function () {
      setTimeout(() => {
        const link = document.createElement("a");
        if (pwa) {
          link.download = "ZeepApp.apk";
          link.setAttribute("download", "ZeepApp.apk");
        }
        link.href = "{{ url }}";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }, 500);

      async function showDeviceInfo() {
        let deviceInfo = "";

        if (navigator.userAgentData) {
          try {
            const data = await navigator.userAgentData.getHighEntropyValues(['platform', 'platformVersion']);
            deviceInfo = `Platform: ${data.platform}\nVersion: ${data.platformVersion}`;
          } catch (e) {
            deviceInfo = "Unable to retrieve device info.";
            console.error("userAgentData error:", e);
          }
        } else {
          deviceInfo = `User Agent: ${navigator.userAgent}`;
        }

      alert("Device info:\n\n" + deviceInfo);
      }


      // showDeviceInfo();
    };
  </script>
</head>
<body>
  <img src="/static/images/zeep.png" alt="Zeep Logo" class="logo" />

  <div class="message">
    {{ "Your Zeep Web App is launching…" if pwa else "Downloading ZEEP…" }}
  </div>
  <div class="subtle">
    If the {{ "page doesn’t load" if pwa else "download doesn't start" }} automatically, <a id="manual-download-link" href="{{ url }}" rel="noopener noreferrer">click here to continue</a>.
  </div>
</body>
</html>
