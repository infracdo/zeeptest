<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Downloading Your File</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    img.logo {
      width: 120px;
      margin-bottom: 24px;
    }

    .message {
      font-size: 1.25rem;
      font-weight: 500;
      max-width: 400px;
    }

    .subtle {
      margin-top: 12px;
      font-size: 0.95rem;
      color: #666;
    }
  </style>
  <script>
    function getAndroidVersion(ua) {
      ua = ua || navigator.userAgent;
      let match = ua.match(/android\s+(\d+(\.\d+)?);/i);
      return match ? parseFloat(match[1]) : null;
    }
    window.onload = function () {
      const androidVersion = getAndroidVersion();
      console.log(`Detected Android version: ${androidVersion}`);

      let downloadUrl;
      if (androidVersion && androidVersion >= 12) {
        downloadUrl = "{{ playstore_url }}";
      } else {
        downloadUrl = "{{ pwa_url }}";
      }

      document.getElementById("manual-download-link").href = downloadUrl;

      setTimeout(() => {
        const link = document.createElement("a");
        link.href = downloadUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }, 500);
    };
  </script>
</head>
<body>
  <img src="/static/images/zeep.png" alt="Zeep Logo" class="logo" />

  <div class="message">
    Your download will begin shortly.
  </div>
  <div class="subtle">
    If it doesn’t start automatically, <a id="manual-download-link" href="#" target="_blank" rel="noopener noreferrer">click here</a>.
  </div>
</body>
</html>
