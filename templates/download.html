<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ "Launching Zeep Web App" if pwa else "Opening Google Play Store" }}</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    img.logo {
      width: 120px;
      margin-bottom: 24px;
    }

    .message {
      font-size: 1.25rem;
      font-weight: 600;
      max-width: 400px;
    }

    .subtle {
      margin-top: 12px;
      font-size: 0.95rem;
      color: #666;
    }
  </style>
  <script>
    window.onload = function () {
      const downloadUrl = "{{ url }}";
      const manualLink = document.getElementById("manual-download-link");
      manualLink.href = downloadUrl;

      setTimeout(() => {
        const link = document.createElement("a");
        link.href = downloadUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }, 500);
    };
  </script>
</head>
<body>
  <img src="/static/images/zeep.png" alt="Zeep Logo" class="logo" />

  <div class="message">
    {{ "Your Zeep web app is launching…" if pwa else "Redirecting you to the Google Play Store…" }}
  </div>
  <div class="subtle">
    If the page doesn’t load automatically, <a id="manual-download-link" href="#" target="_blank" rel="noopener noreferrer">click here to continue</a>.
  </div>
</body>
</html>
